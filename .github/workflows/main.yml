name: Build AcadMind Flutter APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android runner
        run: flutter create --platforms=android --org com.acadmind --project-name acadmind .
      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("android/app")
          gradle = app / "build.gradle.kts"
          kotlin_dsl = gradle.exists()
          if not kotlin_dsl:
              gradle = app / "build.gradle"
          if not gradle.exists():
              raise SystemExit("Android app Gradle file was not generated")

          text = gradle.read_text()
          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              marker = "android {"
              if marker not in text:
                  raise SystemExit("Could not find android block in app Gradle file")
              if kotlin_dsl:
                  block = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }"""
              else:
                  block = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }"""
              text = text.replace(marker, block, 1)

          if "desugar_jdk_libs" not in text:
              if kotlin_dsl:
                  text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"

          gradle.write_text(text)
          print(f"Enabled core library desugaring in {gradle}")
          PY
      - name: Remove Flutter template test
        run: |
          rm -f test/widget_test.dart
          rmdir test 2>/dev/null || true
      - name: Keep AcadMind Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/app')
          for p in root.rglob('build.gradle*'):
              t = p.read_text()
              t = t.replace('com.acadmind.acadmind', 'com.acadmind.app')
              p.write_text(t)
          manifest = root / 'src/main/AndroidManifest.xml'
          if manifest.exists():
              t = manifest.read_text().replace('android:label="acadmind"', 'android:label="AcadMind"')
              t = t.replace('<application', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application', 1)
              manifest.write_text(t)
          for p in root.rglob('MainActivity.kt'):
              t = p.read_text().replace('package com.acadmind.acadmind', 'package com.acadmind.app')
              target = root / 'src/main/kotlin/com/acadmind/app/MainActivity.kt'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(t)
              p.unlink()
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --no-pub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acadmind-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
