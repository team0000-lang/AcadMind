name: Build AcadMind Flutter APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'fix/ai-library-pdf-ingestion']
    paths:
      - '**'
  pull_request:
    branches: [main, master]
    paths:
      - '**'
permissions:
  contents: read
concurrency:
  group: acadmind-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android runner
        run: flutter create --platforms=android --org com.acadmind --project-name acadmind .
      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("android/app")
          gradle = app / "build.gradle.kts"
          kotlin_dsl = gradle.exists()
          if not kotlin_dsl:
              gradle = app / "build.gradle"
          if not gradle.exists():
              raise SystemExit("Android app Gradle file was not generated")

          text = gradle.read_text()
          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              marker = "android {"
              if marker not in text:
                  raise SystemExit("Could not find android block in app Gradle file")
              if kotlin_dsl:
                  block = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }"""
              else:
                  block = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }"""
              text = text.replace(marker, block, 1)

          if "desugar_jdk_libs" not in text:
              if kotlin_dsl:
                  text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"

          gradle.write_text(text)
          print(f"Enabled core library desugaring in {gradle}")
          PY
      - name: Remove Flutter template test
        run: |
          rm -f test/widget_test.dart
          rmdir test 2>/dev/null || true
      - name: Install Pillow for launcher icon generation
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Configure AcadMind Android identity and launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image

          root = Path('android/app')
          for p in root.rglob('build.gradle*'):
              t = p.read_text().replace('com.acadmind.acadmind', 'com.acadmind.app')
              p.write_text(t)

          manifest = root / 'src/main/AndroidManifest.xml'
          if manifest.exists():
              t = manifest.read_text().replace('android:label="acadmind"', 'android:label="AcadMind"')
              t = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', t, count=1)
              if 'android:roundIcon=' in t:
                  t = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', t, count=1)
              else:
                  t = t.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher"' + chr(10) + '        android:roundIcon="@mipmap/ic_launcher_round"', 1)

              permissions = []
              if 'android.permission.INTERNET' not in t:
                  permissions.append('    <uses-permission android:name="android.permission.INTERNET" />')
              if 'android.permission.POST_NOTIFICATIONS' not in t:
                  permissions.append('    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />')
              if permissions:
                  t = t.replace('<application', chr(10).join(permissions) + chr(10) + '    <application', 1)
              manifest.write_text(t)

          icon_source = Path('assets/branding/acadmind_icon.png')
          if not icon_source.exists():
              raise SystemExit(f'Missing new app icon: {icon_source}')

          image = Image.open(icon_source).convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          res = root / 'src/main/res'
          for density, size in sizes.items():
              folder = res / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              scaled = image.resize((size, size), Image.Resampling.LANCZOS)
              scaled.save(folder / 'ic_launcher.png', optimize=True)
              scaled.save(folder / 'ic_launcher_round.png', optimize=True)

          for p in root.rglob('MainActivity.kt'):
              t = p.read_text().replace('package com.acadmind.acadmind', 'package com.acadmind.app')
              target = root / 'src/main/kotlin/com/acadmind/app/MainActivity.kt'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(t)
              p.unlink()
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Run Flutter tests
        run: flutter test
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --no-pub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acadmind-universal-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
